name: Foundation Fitness

on:
  push:
    branches:
      - feat/m0-foundation
    paths:
      - "scripts/run_foundation_fitness.py"
      - "evals/foundation/**"
      - ".github/workflows/foundation-fitness.yml"
  pull_request:
    paths:
      - "scripts/run_foundation_fitness.py"
      - "evals/foundation/**"

permissions:
  contents: read

jobs:
  safety-kernel:
    name: M0 Safety Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Run foundation fitness
        run: |
          mkdir -p build
          python3 scripts/run_foundation_fitness.py             --report build/foundation-fitness.json

      - name: Print foundation fitness report
        if: always()
        run: |
          if [ -f build/foundation-fitness.json ]; then
            cat build/foundation-fitness.json
          fi
