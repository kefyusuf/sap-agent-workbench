name: M1 Reference Harness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-reference-harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: M1 Exact Reference Harness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show selected toolchain
        run: |
          node --version
          npm --version

      - name: Execute revision-bound verification
        run: node scripts/verify_m1_reference_harness.mjs

      - name: Print verification report
        if: always()
        run: |
          if [ -f build/m1-reference-harness-verification.json ]; then
            cat build/m1-reference-harness-verification.json
          else
            echo "verification report not produced"
          fi
