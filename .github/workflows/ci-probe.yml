name: CI Probe

on:
  push:
    branches:
      - feat/m0-foundation
    paths:
      - ".github/workflows/ci-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: GitHub-hosted Runner Probe
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Probe runner execution
        run: |
          echo "github-actions-runner-started"
          uname -a
          python3 --version
